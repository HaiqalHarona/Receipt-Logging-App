name: Flutter CI/CD Pipeline

on:
  push:
    branches:
      - master
      - main
      - develop
      - alpha
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - master
      - main
      - develop
      - alpha
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Analyze and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter"

      - name: Create Dummy .env for CI
        run: |
          echo "SUPABASE_URL=https://dummy.supabase.co" > .env
          echo "SUPABASE_ANON_KEY=dummy_anon_key_for_ci" >> .env
          echo "FASTAPI_BASE_URL=https://dummy-receipt-api.com" >> .env
          echo "OCR_SPACE_API_KEY=dummy_ocr_key" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Format code
        run: dart format lib test

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run static analysis
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-android:
    name: Build Android APK
    needs: analyze-and-test
    runs-on: ubuntu-latest
    if: contains(fromJSON('["main", "master", "develop", "alpha"]'), github.ref_name) || contains(fromJSON('["main", "master", "develop", "alpha"]'), github.base_ref) || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Dummy .env for CI
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://dummy.supabase.co' }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'dummy_anon_key_for_ci' }}" >> .env
          echo "FASTAPI_BASE_URL=${{ secrets.FASTAPI_BASE_URL || 'http://100.98.101.54:8085' }}" >> .env
          echo "API_BASE_URL=${{ secrets.API_BASE_URL || 'http://100.98.101.54:8085/api/v1' }}" >> .env
          echo "OCR_SPACE_API_KEY=${{ secrets.OCR_SPACE_API_KEY || 'dummy_ocr_key' }}" >> .env
          echo "APP_ENV=alpha" >> .env
          echo "STAGING_MANIFEST_URL=http://${{ secrets.SERVER_HOST || '100.98.101.54' }}:9090/staging_manifest.json" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: |
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/SancFund.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/SancFund.apk

      - name: Generate Staging Manifest
        run: |
          mkdir -p build/staging
          cat <<EOF > build/staging/staging_manifest.json
          {
            "stage": "Alpha",
            "channel": "staging",
            "version": "1.0.1",
            "buildNumber": ${{ github.run_number }},
            "versionDisplay": "1.0.1.0.${{ github.run_number }}",
            "downloadUrl": "http://${{ secrets.SERVER_HOST || '100.98.101.54' }}:9090/SancFund.apk",
            "releaseNotes": "Automated Alpha build from commit ${{ github.sha }} on ${{ github.ref_name }}",
            "publishedAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF

      - name: Upload Staging Manifest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-manifest
          path: build/staging/staging_manifest.json


  deploy-to-tailscale-server:
    name: Deploy APK & Manifest to Tailscale Staging Server
    needs: build-android
    runs-on: ubuntu-latest
    if: (github.ref_name == 'alpha' || github.event_name == 'workflow_dispatch') && success()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Built APK
        uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: ./staging_artifacts

      - name: Download Staging Manifest
        uses: actions/download-artifact@v4
        with:
          name: staging-manifest
          path: ./staging_artifacts

      - name: Connect to Tailscale
        if: env.HAS_TS_SECRET == 'true'
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
        env:
          HAS_TS_SECRET: ${{ secrets.TAILSCALE_AUTHKEY != '' }}

      - name: Copy APK and Manifest to Staging Server over Tailscale
        if: env.HAS_TS_SECRET == 'true' && env.HAS_HOST_SECRET == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts || true
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new ./staging_artifacts/SancFund.apk ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_DEST_PATH || '/opt/apk-server/apks' }}/SancFund.apk
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new ./staging_artifacts/staging_manifest.json ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_DEST_PATH || '/opt/apk-server/apks' }}/staging_manifest.json
        env:
          HAS_TS_SECRET: ${{ secrets.TAILSCALE_AUTHKEY != '' }}
          HAS_HOST_SECRET: ${{ secrets.SERVER_HOST != '' && secrets.SERVER_SSH_KEY != '' }}

      - name: Trigger Portainer Stack Redeploy Webhook
        if: env.HAS_TS_SECRET == 'true' && env.HAS_WEBHOOK_SECRET == 'true'
        run: |
          echo "Triggering Portainer stack redeploy..."
          curl -k -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
        env:
          HAS_TS_SECRET: ${{ secrets.TAILSCALE_AUTHKEY != '' }}
          HAS_WEBHOOK_SECRET: ${{ secrets.PORTAINER_WEBHOOK_URL != '' }}





