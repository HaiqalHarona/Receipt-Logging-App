name: Flutter CI/CD Pipeline

on:
  push:
    branches:
      - master
      - main
      - develop
      - alpha
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - master
      - main
      - develop
      - alpha
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Analyze and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter"

      - name: Create Dummy .env for CI
        run: |
          echo "API_BASE_URL=https://dummy-receipt-api.com/api/v1" > .env
          echo "FASTAPI_BASE_URL=https://dummy-receipt-api.com" >> .env
          echo "APP_ENV=development" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Format code
        run: dart format lib test

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run static analysis
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-staging:
    name: Build Android Debug APK (Staging)
    needs: analyze-and-test
    runs-on: ubuntu-latest
    if: |
      (github.ref_name == 'alpha' && github.event_name == 'push') ||
      (github.event_name == 'pull_request') ||
      (github.event_name == 'workflow_dispatch' && github.ref_name != 'master' && github.ref_name != 'main')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Read version from pubspec.yaml
        id: version
        run: |
          VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d '[:space:]')
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT

      - name: Create staging .env
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL || 'https://stagingsancfund.effoc.org/api/v1' }}
          FASTAPI_BASE_URL: ${{ secrets.FASTAPI_BASE_URL || 'https://stagingsancfund.effoc.org' }}
          REVENUE_CAT_KEY: ${{ secrets.REVENUE_CAT_KEY || 'goog_OYFkpggzSHFSwrghtjyXxrhZgpL' }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID || '375413677116-ihf89u22nhshkh7u7teoeg57i2un1sl0.apps.googleusercontent.com' }}
          SERVER_HOST: ${{ secrets.SERVER_HOST || '100.98.101.54' }}
        run: |
          echo "API_BASE_URL=${API_BASE_URL}" > .env
          echo "FASTAPI_BASE_URL=${FASTAPI_BASE_URL}" >> .env
          echo "REVENUE_CAT_KEY=${REVENUE_CAT_KEY}" >> .env
          echo "GOOGLE_SERVER_CLIENT_ID=${GOOGLE_SERVER_CLIENT_ID}" >> .env
          echo "APP_ENV=staging" >> .env
          echo "STAGING_MANIFEST_URL=http://${SERVER_HOST}:9090/staging_manifest.json" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android Debug APK
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL || 'https://stagingsancfund.effoc.org/api/v1' }}
          FASTAPI_BASE_URL: ${{ secrets.FASTAPI_BASE_URL || 'https://stagingsancfund.effoc.org' }}
          REVENUE_CAT_KEY: ${{ secrets.REVENUE_CAT_KEY || 'goog_OYFkpggzSHFSwrghtjyXxrhZgpL' }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID || '375413677116-ihf89u22nhshkh7u7teoeg57i2un1sl0.apps.googleusercontent.com' }}
          SERVER_HOST: ${{ secrets.SERVER_HOST || '100.98.101.54' }}
        run: |
          BUILD_NUM=${{ github.run_number }}
          VERSION_NAME="${{ steps.version.outputs.version_name }}"
          VERSION_DISPLAY="${VERSION_NAME}+${BUILD_NUM}"

          flutter build apk --debug --no-tree-shake-icons --android-skip-build-dependency-validation \
            --build-name="${VERSION_NAME}" \
            --build-number="${BUILD_NUM}" \
            --dart-define=APP_NAME="SancFund" \
            --dart-define=APP_ENV=staging \
            --dart-define=APP_VERSION="${VERSION_NAME}" \
            --dart-define=APP_BUILD_NUMBER="${BUILD_NUM}" \
            --dart-define=APP_VERSION_DISPLAY="${VERSION_DISPLAY}" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=FASTAPI_BASE_URL="$FASTAPI_BASE_URL" \
            --dart-define=REVENUE_CAT_KEY="$REVENUE_CAT_KEY" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID" \
            --dart-define=STAGING_MANIFEST_URL="http://${SERVER_HOST}:9090/staging_manifest.json"

          cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/SancFund.apk

      - name: Generate Staging Manifest
        run: |
          mkdir -p build/staging
          cat <<EOF > build/staging/staging_manifest.json
          {
            "stage": "Alpha",
            "channel": "staging",
            "version": "${{ steps.version.outputs.version_name }}",
            "buildNumber": ${{ github.run_number }},
            "versionDisplay": "${{ steps.version.outputs.version_name }}+${{ github.run_number }}",
            "downloadUrl": "http://${{ secrets.SERVER_HOST || '100.98.101.54' }}:9090/SancFund.apk",
            "releaseNotes": "Automated Alpha build from commit ${{ github.sha }} on ${{ github.ref_name }}",
            "publishedAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF

      - name: Upload Staging Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/SancFund.apk

      - name: Upload Staging Manifest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-manifest
          path: build/staging/staging_manifest.json

  deploy-to-tailscale-server:
    name: Deploy APK & Manifest to Tailscale Staging Server
    needs: build-staging
    runs-on: ubuntu-latest
    if: (github.ref_name == 'alpha' || github.event_name == 'workflow_dispatch') && success()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Built APK
        uses: actions/download-artifact@v4
        with:
          name: android-debug-apk-${{ github.run_number }}
          path: ./staging_artifacts

      - name: Download Staging Manifest
        uses: actions/download-artifact@v4
        with:
          name: staging-manifest
          path: ./staging_artifacts

      - name: Connect to Tailscale
        if: env.HAS_TS_SECRET == 'true'
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
        env:
          HAS_TS_SECRET: ${{ secrets.TAILSCALE_AUTHKEY != '' }}

      - name: Copy APK and Manifest to Staging Server over Tailscale
        if: env.HAS_TS_SECRET == 'true' && env.HAS_HOST_SECRET == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts || true
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new ./staging_artifacts/SancFund.apk ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_DEST_PATH || '/opt/apk-server/apks' }}/SancFund.apk
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new ./staging_artifacts/staging_manifest.json ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_DEST_PATH || '/opt/apk-server/apks' }}/staging_manifest.json
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new ./deploy/apk-server/index.html ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_DEST_PATH || '/opt/apk-server/apks' }}/index.html
        env:
          HAS_TS_SECRET: ${{ secrets.TAILSCALE_AUTHKEY != '' }}
          HAS_HOST_SECRET: ${{ secrets.SERVER_HOST != '' && secrets.SERVER_SSH_KEY != '' }}

      - name: Trigger Portainer Stack Redeploy Webhook
        if: env.HAS_TS_SECRET == 'true' && env.HAS_WEBHOOK_SECRET == 'true'
        run: |
          echo "Triggering Portainer stack redeploy..."
          curl -k -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
        env:
          HAS_TS_SECRET: ${{ secrets.TAILSCALE_AUTHKEY != '' }}
          HAS_WEBHOOK_SECRET: ${{ secrets.PORTAINER_WEBHOOK_URL != '' }}

  build-release-aab:
    name: Build Android Release AAB (Production)
    needs: analyze-and-test
    runs-on: ubuntu-latest
    if: |
      (github.ref_name == 'master' || github.ref_name == 'main') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify production secrets
        env:
          PROD_KEYSTORE_BASE64: ${{ secrets.PROD_KEYSTORE_BASE64 }}
          PROD_KEYSTORE_PASSWORD: ${{ secrets.PROD_KEYSTORE_PASSWORD }}
          PROD_KEY_ALIAS: ${{ secrets.PROD_KEY_ALIAS }}
          PROD_KEY_PASSWORD: ${{ secrets.PROD_KEY_PASSWORD }}
          PROD_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
          REVENUE_CAT_KEY: ${{ secrets.REVENUE_CAT_KEY }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          MISSING=""
          [ -z "$PROD_KEYSTORE_BASE64" ] && MISSING="${MISSING} PROD_KEYSTORE_BASE64"
          [ -z "$PROD_KEYSTORE_PASSWORD" ] && MISSING="${MISSING} PROD_KEYSTORE_PASSWORD"
          [ -z "$PROD_KEY_ALIAS" ] && MISSING="${MISSING} PROD_KEY_ALIAS"
          [ -z "$PROD_KEY_PASSWORD" ] && MISSING="${MISSING} PROD_KEY_PASSWORD"
          [ -z "$PROD_API_BASE_URL" ] && MISSING="${MISSING} PROD_API_BASE_URL"
          [ -z "$REVENUE_CAT_KEY" ] && MISSING="${MISSING} REVENUE_CAT_KEY"
          [ -z "$GOOGLE_SERVER_CLIENT_ID" ] && MISSING="${MISSING} GOOGLE_SERVER_CLIENT_ID"
          if [ -n "${MISSING}" ]; then
            echo "ERROR: Missing required production secrets:${MISSING}"
            echo "Add these to GitHub repo -> Settings -> Secrets and variables -> Actions"
            exit 1
          fi
          echo "All required production secrets are present."

      - name: Read version from pubspec.yaml
        id: version
        run: |
          VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d '[:space:]')
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "aab_name=SancFund-${VERSION_NAME}+${{ github.run_number }}.aab" >> $GITHUB_OUTPUT

      - name: Create production .env
        env:
          PROD_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
          PROD_FASTAPI_BASE_URL: ${{ secrets.PROD_FASTAPI_BASE_URL || secrets.PROD_API_BASE_URL }}
          REVENUE_CAT_KEY: ${{ secrets.REVENUE_CAT_KEY }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          echo "API_BASE_URL=${PROD_API_BASE_URL}" > .env
          echo "FASTAPI_BASE_URL=${PROD_FASTAPI_BASE_URL}" >> .env
          echo "REVENUE_CAT_KEY=${REVENUE_CAT_KEY}" >> .env
          echo "GOOGLE_SERVER_CLIENT_ID=${GOOGLE_SERVER_CLIENT_ID}" >> .env
          echo "APP_ENV=production" >> .env

      - name: Install dependencies
        run: flutter pub get

      - name: Decode production keystore
        env:
          PROD_KEYSTORE_BASE64: ${{ secrets.PROD_KEYSTORE_BASE64 }}
        run: |
          echo "$PROD_KEYSTORE_BASE64" | base64 -d > android/release.keystore

      - name: Write key.properties
        env:
          PROD_KEYSTORE_PASSWORD: ${{ secrets.PROD_KEYSTORE_PASSWORD }}
          PROD_KEY_PASSWORD: ${{ secrets.PROD_KEY_PASSWORD }}
          PROD_KEY_ALIAS: ${{ secrets.PROD_KEY_ALIAS }}
        run: |
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.keystore\n' \
            "$PROD_KEYSTORE_PASSWORD" "$PROD_KEY_PASSWORD" "$PROD_KEY_ALIAS" > android/key.properties

      - name: Build Release AAB
        env:
          PROD_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
          PROD_FASTAPI_BASE_URL: ${{ secrets.PROD_FASTAPI_BASE_URL || secrets.PROD_API_BASE_URL }}
          REVENUE_CAT_KEY: ${{ secrets.REVENUE_CAT_KEY }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          BUILD_NUM=${{ github.run_number }}
          VERSION_NAME="${{ steps.version.outputs.version_name }}"
          VERSION_DISPLAY="${VERSION_NAME}+${BUILD_NUM}"

          flutter build appbundle --release --no-tree-shake-icons \
            --build-name="${VERSION_NAME}" \
            --build-number="${BUILD_NUM}" \
            --dart-define=APP_NAME="SancFund" \
            --dart-define=APP_ENV=production \
            --dart-define=APP_VERSION="${VERSION_NAME}" \
            --dart-define=APP_BUILD_NUMBER="${BUILD_NUM}" \
            --dart-define=APP_VERSION_DISPLAY="${VERSION_DISPLAY}" \
            --dart-define=API_BASE_URL="$PROD_API_BASE_URL" \
            --dart-define=FASTAPI_BASE_URL="$PROD_FASTAPI_BASE_URL" \
            --dart-define=REVENUE_CAT_KEY="$REVENUE_CAT_KEY" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

          cp build/app/outputs/bundle/release/app-release.aab \
             build/app/outputs/bundle/release/${{ steps.version.outputs.aab_name }}

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab-${{ github.run_number }}
          path: build/app/outputs/bundle/release/${{ steps.version.outputs.aab_name }}
          retention-days: 90

      - name: Cleanup sensitive signing files
        if: always()
        run: |
          rm -f android/release.keystore android/key.properties .env
