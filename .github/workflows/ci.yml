name: Flutter CI/CD Pipeline

on:
  push:
    branches:
      - master
      - main
      - develop
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - master
      - main
      - develop
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: 🧪 Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter"

      - name: 🔑 Create Dummy .env for CI
        run: |
          echo "SUPABASE_URL=https://dummy.supabase.co" > .env
          echo "SUPABASE_ANON_KEY=dummy_anon_key_for_ci" >> .env
          echo "FASTAPI_BASE_URL=https://dummy-receipt-api.com" >> .env
          echo "OCR_SPACE_API_KEY=dummy_ocr_key" >> .env

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 📐 Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: 🔍 Run static analysis
        run: flutter analyze

      - name: 🧪 Run tests with coverage
        run: flutter test --coverage

      - name: 📊 Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-android:
    name: 🤖 Build Android APK
    needs: analyze-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🔑 Create Dummy .env for CI
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://dummy.supabase.co' }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'dummy_anon_key_for_ci' }}" >> .env
          echo "FASTAPI_BASE_URL=${{ secrets.FASTAPI_BASE_URL || 'https://dummy-receipt-api.com' }}" >> .env
          echo "OCR_SPACE_API_KEY=${{ secrets.OCR_SPACE_API_KEY || 'dummy_ocr_key' }}" >> .env

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🏗️ Build Android APK
        run: flutter build apk --release

      - name: 📤 Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-web:
    name: 🌐 Build Web App
    needs: analyze-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🔑 Create Dummy .env for CI
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://dummy.supabase.co' }}" > .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'dummy_anon_key_for_ci' }}" >> .env
          echo "FASTAPI_BASE_URL=${{ secrets.FASTAPI_BASE_URL || 'https://dummy-receipt-api.com' }}" >> .env
          echo "OCR_SPACE_API_KEY=${{ secrets.OCR_SPACE_API_KEY || 'dummy_ocr_key' }}" >> .env

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🏗️ Build Web Release
        run: flutter build web --release

      - name: 📤 Upload Web Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-release-bundle
          path: build/web
