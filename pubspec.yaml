name: reciept_logging
description: "Receipt Scanner & Expense Tracker — scan receipts, log data, track spending."
publish_to: 'none'

version: 1.0.1+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # ── Icons ───────────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8

  # ── Local Database ───────────────────────────────────────────────────────────
  # NOTE: isar_generator (dev dep) is omitted — receipt.g.dart is already
  # generated and checked in. Re-add isar_generator only when adding new
  # Isar collections (requires a matching analyzer version).
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.6

  # ── State Management ────────────────────────────────────────────────────────
  # Using manual Riverpod API (NotifierProvider, FutureProvider) — no code-gen.
  flutter_riverpod: ^2.6.1

  # ── Routing ─────────────────────────────────────────────────────────────────
  go_router: ^14.8.1

  # ── Camera & On-Device OCR ──────────────────────────────────────────────────
  camera: ^0.11.0+2
  google_mlkit_text_recognition: ^0.15.0
  image_picker: ^1.1.2

  # ── Neumorphic UI ────────────────────────────────────────────────────────────
  flutter_neumorphic_plus: ^3.3.0
  flutter_markdown: ^0.7.5

  # ── Supabase Client ──────────────────────────────────────────────────────────
  supabase_flutter: ^2.8.4

  # ── HTTP / API Client ────────────────────────────────────────────────────────
  http: ^1.2.2
  http_parser: ^4.1.0
  dio: ^5.7.0

  # ── Connectivity / Offline-First ─────────────────────────────────────────────
  connectivity_plus: ^6.1.4

  # ── Secure Storage ───────────────────────────────────────────────────────────
  flutter_secure_storage: ^9.2.4

  # ── Utilities ────────────────────────────────────────────────────────────────
  intl: ^0.20.2
  uuid: ^4.5.1
  logger: ^2.5.0
  collection: ^1.18.0
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.3.5
  cryptography: ^2.9.0
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.13
  # NOTE: isar_generator, riverpod_generator, build_runner are intentionally
  # omitted — they all transitively conflict through source_gen ^1.x vs ^2.x
  # when combined with isar_generator 3.1.0+1. The generated receipt.g.dart
  # is already committed. Re-add when upgrading to Isar 4+.

flutter:
  uses-material-design: true
  # Note: .env is excluded from release assets for security. Configure via --dart-define or --dart-define-from-file.
