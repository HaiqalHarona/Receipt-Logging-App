server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html/apks;
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    location / {
        types { }
        default_type application/vnd.android.package-archive;
    }

    location /ping {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
